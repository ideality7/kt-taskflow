<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>TaskFlow</h1>
    <button id="openModalBtn" class="btn-add">+ 업무 추가</button>
  </header>

  <main class="board">
    <section class="column" data-status="todo">
      <div class="column-header">
        <span class="column-title">할 일</span>
        <span class="column-count" id="count-todo">0</span>
      </div>
      <div class="task-list" id="list-todo"></div>
    </section>

    <section class="column" data-status="inprogress">
      <div class="column-header">
        <span class="column-title">진행 중</span>
        <span class="column-count" id="count-inprogress">0</span>
      </div>
      <div class="task-list" id="list-inprogress"></div>
    </section>

    <section class="column" data-status="done">
      <div class="column-header">
        <span class="column-title">완료</span>
        <span class="column-count" id="count-done">0</span>
      </div>
      <div class="task-list" id="list-done"></div>
    </section>
  </main>

  <!-- 업무 추가 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>새 업무 추가</h2>
        <button class="modal-close" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body">
        <label for="taskTitle">제목 <span class="required">*</span></label>
        <input type="text" id="taskTitle" placeholder="업무 제목을 입력하세요" maxlength="100" />

        <label for="taskDesc">설명</label>
        <textarea id="taskDesc" placeholder="업무 설명을 입력하세요 (선택)" rows="3" maxlength="500"></textarea>

        <label for="taskPriority">우선순위</label>
        <select id="taskPriority">
          <option value="low">낮음</option>
          <option value="medium" selected>보통</option>
          <option value="high">높음</option>
        </select>

        <label for="taskDue">마감일</label>
        <input type="date" id="taskDue" />
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="cancelBtn">취소</button>
        <button class="btn-submit" id="submitBtn">추가</button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div class="modal-overlay" id="deleteOverlay">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>업무 삭제</h2>
      </div>
      <div class="modal-body">
        <p>이 업무를 삭제하시겠습니까?</p>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="deleteCancelBtn">취소</button>
        <button class="btn-delete" id="deleteConfirmBtn">삭제</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
